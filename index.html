<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="./icon/logo.svg">
</head>
<body>
  <div class="ambient ambient--purple"></div>
  <div class="ambient ambient--blue"></div>
  <main class="hero" id="about">
    <header class="site-header">
      <a href="#" class="logo">
        <img src="./icon/logo.svg" alt="AETHER logo">
        <span>AETHER</span>
      </a>
    </header>
    <div class="album-grid">
      <div class="sound-card" data-track="Баллада" data-artist="Xcho и Мот">
        <img src="./image/Баллада.webp" alt="">
        <h3 class="nameSound">Баллада</h3>
        <p class="authorSound">Xcho и Мот</p>
      </div>
      <div class="sound-card" data-track="Лужники" data-artist="Basta, Guf ">
        <img src="./image/Лужники.webp" alt="">
        <h3 class="nameSound">Лужники</h3>
        <p class="authorSound">Basta, Guf </p>
      </div>
      <div class="sound-card" data-track="Marlboro" data-artist="Miyagi">
        <img src="./image/Marlboro.jpg" alt="">
        <h3 class="nameSound">Marlboro</h3>
        <p class="authorSound">Miyagi</p>
      </div>
    </div>
    <div class="now-playing">
      <div class="player-track">
        <img id="current-cover" src="" alt="Обложка трека">
        <div class="loading-spinner">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="player-controls">
        <h2 id="current-track">Трек не выбран</h2>
        <p id="current-artist">Исполнитель не выбран</p>
        <p id="player-status"></p>
        <div class="play-mixer">
          <p id="start-treck">0:00</p>
          <input type="range" id="progress" min="0" value="0">
          <p id="end-treck">0:00</p>
        </div>
        <div class="buttons-track">
          <button id="previous-button">&lt;</button>
          <button id="shuffle-button"><img src="./icon/shuffle.png"></button>
          <button id="play-button">▶ Play</button>
          <button id="repeat-button"><img src="./icon/repeat.png"></button>
          <button id="next-button">&gt;</button>
        </div>
        <div class="player-extra">
          <button id="mute-button">
            <img class="mute-icon" src="./icon/music.png">
          </button>
          <input 
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          >
        </div>
      </div>
      
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
